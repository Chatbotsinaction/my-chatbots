<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Chatbot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Floating Chat Icon */
        #chatToggleButton {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #667eea;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 9999;
        }

        /* Chat Widget Container */
        #chatWidget {
            position: fixed;
            bottom: 100px;
            right: 25px;
            width: 360px;
            max-height: 500px;
            z-index: 9998;

            /* Start hidden */
            opacity: 0;
            visibility: hidden;
            transform: translateY(30px);

            /* Animation */
            transition:
                opacity 0.50s ease,
                transform 0.35s ease,
                visibility 0.35s;
        }

        #chatWidget.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .chat-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .chat-header {
            background: #4a5568;
            color: white;
            padding: 20px;
            position: relative;
        }

        #closeChat {
            position: absolute;
            right: 15px;
            top: 15px;
            cursor: pointer;
            font-size: 20px;
        }

        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 20px;
            background: #f7fafc;
        }

        .message {
            margin: 15px 0;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .bot-message {
            background: #e2e8f0;
            color: #2d3748;
        }

        .chat-input {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }

        .chat-input button {
            margin-left: -60px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        #micButton {
            background: #4a5568;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }

        #micButton:hover {
            background: #2d3748;
        }

        .typing {
            font-style: italic;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Floating Chat Icon -->
    <div id="chatToggleButton">💬</div>

    <!-- Chat Widget -->
    <div id="chatWidget">
        <div class="chat-container">

            <div class="chat-header">
                <h3>🤖 Sacha's Chatbot</h3>
                <span id="closeChat">✖</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    Hello! I'm ready to help. Ask me anything!
                </div>
            </div>

            <div class="chat-input">
                <input id="messageInput" type="text" placeholder="Type your message..."onkeypress="handleKey(event)">
                
                <!-- 🎤 Add the mic button here -->
                <button id="micButton">🎤</button>

                <button id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = 'session_' + Date.now();
        let recognition;

        // -------------------------------
        // Load Persistent Chat History
        // -------------------------------
        //window.onload = () => {
        //    const saved = JSON.parse(localStorage.getItem("chatHistory") || "[]");
        //    saved.forEach(msg => addMessage(msg.text, msg.user, false));
        //};

        // Save messages to localStorage
        //function saveMessage(text, isUser) {
        //    let history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
        //    history.push({ text, user: isUser });
        //    localStorage.setItem("chatHistory", JSON.stringify(history));
        //}

        // -------------------------------
        // Add Message to Chat (safe version)
        // -------------------------------
        function addMessage(content, isUser=false, save=true) {
            const messagesContainer = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
            div.textContent = content;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if (save && typeof saveMessage === 'function') saveMessage(content, isUser);

            if (!isUser) textToSpeech(content);
        }

        // -------------------------------
        // Send Message (safe version with typing animation)
        // -------------------------------
        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, true, false);
            input.value = "";

            // Typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing';
            typingDiv.textContent = "🤖 Typing...";
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message, session_id: sessionId})
                });

                if (!response.ok) throw new Error("HTTP error " + response.status);
                const data = await response.json();

                typingDiv.remove(); // remove typing animation
                addMessage(data.response, false, false);

            } catch (err) {
                typingDiv.remove();
                console.error(err);
                addMessage("❌ Error: " + err.message, false, false);
            }
        }

        // -------------------------------
        // Enter-to-send
        // -------------------------------
        document.getElementById("messageInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                sendMessage();
            }
        });

        // -------------------------------
        // Slide-in Chat Open / Close
        // -------------------------------
        document.getElementById("chatToggleButton").onclick = () => {
            const widget = document.getElementById("chatWidget");
            widget.classList.add("open");
            widget.style.display = "block";
            document.getElementById("chatToggleButton").style.display = "none";
            document.getElementById("messageInput").focus();
        };

        document.getElementById("closeChat").onclick = () => {
            const widget = document.getElementById("chatWidget");
            widget.classList.remove("open");
            setTimeout(() => {
                widget.style.display = "none";
                document.getElementById("chatToggleButton").style.display = "flex";
            }, 300);
        };

        // -------------------------------
        // Text-to-Speech for Bot Replies
        // -------------------------------
        function textToSpeech(text) {
            let utter = new SpeechSynthesisUtterance(text);
            utter.lang = "en-US";
            speechSynthesis.speak(utter);
        }

        // -------------------------------
        // Microphone Speech-to-Text
        // -------------------------------
        document.getElementById("micButton").onclick = () => {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Speech recognition not supported in this browser.");
                return;
            }

            const recognition = new webkitSpeechRecognition();
            recognition.lang = "en-US";
            recognition.interimResults = false;

            recognition.start();

            addMessage("🎧 Listening...", false, false);

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById("messageInput").value = transcript;
                handleVoiceCommand(transcript); // 🔥 Voice command evaluation
            };

            recognition.onerror = () => {
                addMessage("❌ Voice recognition error", false, false);
            };
        };

        // -------------------------------
        // Voice Command Processing
        // -------------------------------
        function handleVoiceCommand(cmd) {
            cmd = cmd.toLowerCase();

            // Voice UI feedback
            addMessage("🗣️ Voice command: " + cmd, false, false);

            if (cmd.includes("send")) {
                sendMessage();
                return;
            }

            if (cmd.includes("clear chat") || cmd.includes("delete chat")) {
                localStorage.removeItem("chatHistory");
                document.getElementById("chatMessages").innerHTML = "";
                addMessage("Chat history cleared 🧹", false, false);
                return;
            }

            if (cmd.includes("close chat") || cmd.includes("hide chat")) {
                document.getElementById("closeChat").click();
                return;
            }

            if (cmd.includes("open chat") || cmd.includes("show chat")) {
                document.getElementById("chatToggleButton").click();
                return;
            }

            if (cmd.includes("read last message")) {
                let history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
                if (history.length > 0) textToSpeech(history[history.length - 1].text);
                return;
            }
        }

        // -------------------------------
        // Send button click
        // -------------------------------
        document.getElementById("sendButton").onclick = sendMessage;

        function handleKey(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
